[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "pawnet"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "Your name (or your organization/company/team)" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "loguru",
    "matplotlib>=3.10.9",
    "mkdocs",
    "modal>=1.4.3",
    "pip",
    "pytest",
    "python-dotenv",
    "ruff",
    "scikit-learn>=1.8.0",
    "torchvision>=0.26.0",
    "tqdm",
    "typer",
]
requires-python = ">=3.11,<3.15"

[project.optional-dependencies]
modal = [
    "modal>=0.65.0",
]


[tool.ruff]
line-length = 99
src = ["pawnet"]
include = ["pyproject.toml", "pawnet/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["pawnet"]
force-sort-within-sections = true
